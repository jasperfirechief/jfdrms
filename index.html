<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jasper Fire Department - RMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- TOP HEADER & NAV -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
        <div class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center font-bold text-xl border-2 border-white">
          J
        </div>
        <span class="font-bold text-xl tracking-wide">JASPER FIRE DEPARTMENT</span>
      </div>

      <nav class="hidden md:flex space-x-6 text-sm font-semibold">
        <button id="nav-home" onclick="switchTab('home')" class="hover:text-red-400 transition">Home</button>
        <button id="nav-staffing" onclick="switchTab('staffing')" class="hover:text-red-400 transition">Daily Staffing</button>
        <button id="nav-incidents" onclick="switchTab('incidents')" class="hover:text-red-400 transition">Incidents</button>
        <button id="nav-inspections" onclick="switchTab('inspections')" class="hover:text-red-400 transition">Inspections</button>
        <button id="nav-admin" onclick="switchTab('admin')" class="hover:text-red-400 transition text-yellow-400">Admin Portal</button>
      </nav>

      <div class="flex items-center space-x-3">
        <!-- USER SELECTOR DROPDOWN -->
        <select id="user-selector" onchange="changeActiveUser(this.value)" class="bg-slate-800 text-xs border border-slate-700 rounded px-2 py-1 text-white focus:outline-none">
          <!-- Populated by JavaScript -->
        </select>
        <button onclick="logoutUser()" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1.5 rounded font-bold transition">Logout</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto p-4 md:p-6">

    <!-- TAB 1: HOME -->
    <section id="tab-home" class="tab-content active">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
        <div id="card-staffing" onclick="switchTab('staffing')" class="bg-white p-8 rounded-lg shadow-md hover:shadow-xl transition border-t-4 border-red-600 cursor-pointer flex flex-col items-center justify-center text-center">
          <i class="fa-solid font-bold text-red-600 text-4xl mb-4 fa-users"></i>
          <h2 class="text-xl font-bold text-slate-800 uppercase tracking-wider">Daily Staffing</h2>
        </div>

        <div id="card-incidents" onclick="switchTab('incidents')" class="bg-white p-8 rounded-lg shadow-md hover:shadow-xl transition border-t-4 border-red-600 cursor-pointer flex flex-col items-center justify-center text-center">
          <i class="fa-solid font-bold text-red-600 text-4xl mb-4 fa-fire-flame-curved"></i>
          <h2 class="text-xl font-bold text-slate-800 uppercase tracking-wider">Incident Reporting</h2>
        </div>

        <div id="card-inspections" onclick="switchTab('inspections')" class="bg-white p-8 rounded-lg shadow-md hover:shadow-xl transition border-t-4 border-red-600 cursor-pointer flex flex-col items-center justify-center text-center">
          <i class="fa-solid font-bold text-red-600 text-4xl mb-4 fa-clipboard-check"></i>
          <h2 class="text-xl font-bold text-slate-800 uppercase tracking-wider">Inspections</h2>
        </div>
      </div>
    </section>

    <!-- TAB 2: DAILY STAFFING -->
    <section id="tab-staffing" class="tab-content">
      <h1 class="text-2xl font-bold text-slate-800 mb-6">Daily Roster & Staffing</h1>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="stations-container">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- TAB 3: INCIDENTS -->
    <section id="tab-incidents" class="tab-content">
      <h1 class="text-2xl font-bold text-slate-800 mb-6">Incident Reports</h1>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="incidents-feed">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- TAB 4: INSPECTIONS -->
    <section id="tab-inspections" class="tab-content">
      <h1 class="text-2xl font-bold text-slate-800 mb-6">Apparatus Checklist & Inspections</h1>
      <div class="bg-white p-6 rounded-lg shadow-md max-w-2xl mx-auto">
        <form onsubmit="submitChecklist(event)">
          <div class="mb-4">
            <label class="block font-bold text-slate-700 text-sm mb-1">Select Inspector</label>
            <select id="inspection-inspector" class="w-full border rounded p-2 text-sm" required></select>
          </div>
          <div class="mb-4">
            <label class="block font-bold text-slate-700 text-sm mb-1">Select Apparatus</label>
            <select id="inspection-apparatus" class="w-full border rounded p-2 text-sm" required></select>
          </div>
          <div class="mb-4" id="checklist-items">
            <!-- Items rendered by JS -->
          </div>
          <button type="submit" class="w-full bg-red-600 text-white font-bold py-2 rounded hover:bg-red-700">Submit Inspection</button>
        </form>
      </div>
    </section>

    <!-- TAB 5: ADMIN PORTAL -->
    <section id="tab-admin" class="tab-content">
      <h1 class="text-2xl font-bold text-slate-800 mb-6">Admin Portal</h1>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Personnel Management -->
        <div class="bg-white p-6 rounded-lg shadow-md">
          <h2 class="text-lg font-bold mb-4 border-b pb-2">Add Personnel</h2>
          <form onsubmit="addPersonnel(event)" class="space-y-3">
            <input id="p-fname" type="text" placeholder="First Name" class="w-full border p-2 text-sm rounded" required>
            <input id="p-lname" type="text" placeholder="Last Name" class="w-full border p-2 text-sm rounded" required>
            <input id="p-email" type="email" placeholder="Email" class="w-full border p-2 text-sm rounded" required>
            <select id="p-role" class="w-full border p-2 text-sm rounded">
              <option value="firefighter">Firefighter</option>
              <option value="officer">Officer</option>
              <option value="admin">Admin</option>
            </select>
            <button type="submit" class="bg-slate-900 text-white font-bold px-4 py-2 text-sm rounded hover:bg-slate-800">Add Personnel</button>
          </form>
          <div class="mt-6">
            <h3 class="font-bold text-sm mb-2">Current Personnel</h3>
            <ul id="personnel-list" class="divide-y text-xs text-slate-700"></ul>
          </div>
        </div>

        <!-- Apparatus Management -->
        <div class="bg-white p-6 rounded-lg shadow-md">
          <h2 class="text-lg font-bold mb-4 border-b pb-2">Add Apparatus</h2>
          <form onsubmit="addApparatus(event)" class="flex space-x-2">
            <input id="app-name" type="text" placeholder="e.g. Engine 3" class="flex-grow border p-2 text-sm rounded" required>
            <button type="submit" class="bg-slate-900 text-white font-bold px-4 py-2 text-sm rounded hover:bg-slate-800">Add</button>
          </form>
          <div class="mt-6">
            <h3 class="font-bold text-sm mb-2">Current Apparatus</h3>
            <ul id="apparatus-list" class="divide-y text-xs text-slate-700"></ul>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- JAVASCRIPT APP LOGIC WITH FALLBACK SAFETIES -->
  <script>
    const SUPABASE_URL = 'https://audgtwcctdoiptuekqvn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_oiWaymVcSB3UuhzNsO5kSg_ghVfnOwz';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Default Fallback Data (Ensures system functions even if DB is empty)
    let personnelList = [
      { id: 1, firstName: 'Admin', lastName: 'Chief', role: 'admin', email: 'admin@jasperfire.org' },
      { id: 2, firstName: 'John', lastName: 'Doe', role: 'officer', email: 'jdoe@jasperfire.org' }
    ];
    let apparatusList = [
      { id: 1, name: 'Engine 1' },
      { id: 2, name: 'Ladder 1' },
      { id: 3, name: 'Rescue 2' }
    ];
    let activeIncidents = [
      { cad: '2026-00123', type: 'STRUCTURE FIRE', location: '1200 4th Ave, Jasper, AL', dispatchTime: '14:32', reports: [] }
    ];

    let activeUser = personnelList[0];

    async function loadAppData() {
      try {
        const { data: pData } = await supabase.from('personnel').select('*');
        if (pData && pData.length > 0) {
          personnelList = pData.map(p => ({
            id: p.id,
            firstName: p.first_name,
            lastName: p.last_name,
            role: p.role,
            email: p.email
          }));
        }

        const { data: aData } = await supabase.from('apparatus').select('*');
        if (aData && aData.length > 0) apparatusList = aData;

        const { data: iData } = await supabase.from('incidents').select('*');
        if (iData && iData.length > 0) {
          activeIncidents = iData.map(i => ({
            cad: i.cad,
            type: i.type,
            location: i.location,
            dispatchTime: i.dispatch_time,
            reports: i.reports || []
          }));
        }
      } catch (err) {
        console.warn("Using local fallback data:", err);
      }

      activeUser = personnelList[0];
      renderUserSelect();
      renderPersonnel();
      renderApparatus();
      renderStaffing();
      renderIncidentsFeed();
      renderInspectorDropdown();
      renderChecklist();
      updateNavPermissions();
    }

    function switchTab(tabId) {
      if (!canAccessTab(tabId)) {
        alert("You do not have permission to access this area.");
        return;
      }
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById('tab-' + tabId);
      if (activeEl) activeEl.classList.add('active');
    }

    function canAccessTab(tabName) {
      if (tabName === 'home') return true;
      if (!activeUser) return false;
      if (activeUser.role === 'admin') return true;
      return true;
    }

    function renderUserSelect() {
      const select = document.getElementById('user-selector');
      select.innerHTML = personnelList.map(p => 
        `<option value="${p.id}">${p.firstName} ${p.lastName} (${p.role.toUpperCase()})</option>`
      ).join('');
    }

    function changeActiveUser(userId) {
      activeUser = personnelList.find(p => p.id == userId) || personnelList[0];
      updateNavPermissions();
    }

    function updateNavPermissions() {
      const isAdmin = activeUser && activeUser.role === 'admin';
      
      document.getElementById('nav-staffing').style.display = 'inline-block';
      document.getElementById('nav-incidents').style.display = 'inline-block';
      document.getElementById('nav-inspections').style.display = 'inline-block';
      document.getElementById('nav-admin').style.display = isAdmin ? 'inline-block' : 'none';

      document.getElementById('card-staffing').style.display = 'flex';
      document.getElementById('card-incidents').style.display = 'flex';
      document.getElementById('card-inspections').style.display = 'flex';
    }

    function renderPersonnel() {
      const el = document.getElementById('personnel-list');
      if (el) {
        el.innerHTML = personnelList.map(p => `<li class="py-1">${p.firstName} ${p.lastName} - <span class="uppercase font-semibold">${p.role}</span></li>`).join('');
      }
    }

    function renderApparatus() {
      const el = document.getElementById('apparatus-list');
      const inspectionApp = document.getElementById('inspection-apparatus');
      if (el) {
        el.innerHTML = apparatusList.map(a => `<li class="py-1">${a.name}</li>`).join('');
      }
      if (inspectionApp) {
        inspectionApp.innerHTML = apparatusList.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
      }
    }

    function renderInspectorDropdown() {
      const el = document.getElementById('inspection-inspector');
      if (el) {
        el.innerHTML = personnelList.map(p => `<option value="${p.id}">${p.firstName} ${p.lastName}</option>`).join('');
      }
    }

    function renderStaffing() {
      const container = document.getElementById('stations-container');
      if (!container) return;
      
      const stations = ['Station 1 (Main)', 'Station 2', 'Station 3'];
      container.innerHTML = stations.map((st, idx) => `
        <div class="bg-white p-4 rounded shadow border-l-4 border-red-600">
          <h3 class="font-bold text-lg mb-3">${st}</h3>
          <div class="text-sm space-y-2 text-slate-600">
            <p><strong>Apparatus:</strong> ${apparatusList[idx] ? apparatusList[idx].name : 'Engine ' + (idx + 1)}</p>
            <p><strong>Officer:</strong> ${personnelList[0] ? personnelList[0].firstName + ' ' + personnelList[0].lastName : 'Unassigned'}</p>
            <p><strong>Driver/Engineer:</strong> ${personnelList[1] ? personnelList[1].firstName + ' ' + personnelList[1].lastName : 'Unassigned'}</p>
          </div>
        </div>
      `).join('');
    }

    function renderIncidentsFeed() {
      const container = document.getElementById('incidents-feed');
      if (!container) return;

      container.innerHTML = activeIncidents.map(inc => `
        <div class="bg-white p-5 rounded-lg shadow border border-slate-200">
          <div class="flex justify-between items-center mb-2">
            <span class="bg-red-100 text-red-700 text-xs font-bold px-2 py-0.5 rounded">${inc.type}</span>
            <span class="text-xs text-slate-500 font-mono">${inc.cad}</span>
          </div>
          <p class="text-sm font-bold text-slate-800">${inc.location}</p>
          <p class="text-xs text-slate-500 mt-1">Dispatched: ${inc.dispatchTime}</p>
        </div>
      `).join('');
    }

    function renderChecklist() {
      const container = document.getElementById('checklist-items');
      if (!container) return;
      const items = ['SCBA Check', 'Fuel Level OK', 'Lights & Sirens Functional', 'Medical Bag Inventoried', 'Pump Test Completed'];
      container.innerHTML = items.map((item, i) => `
        <label class="flex items-center space-x-2 py-1 text-sm text-slate-700">
          <input type="checkbox" id="check-${i}" class="rounded text-red-600">
          <span>${item}</span>
        </label>
      `).join('');
    }

    async function addPersonnel(e) {
      e.preventDefault();
      const firstName = document.getElementById('p-fname').value;
      const lastName = document.getElementById('p-lname').value;
      const email = document.getElementById('p-email').value;
      const role = document.getElementById('p-role').value;

      const { data, error } = await supabase.from('personnel').insert([{ first_name: firstName, last_name: lastName, email, role }]).select();
      if (error) {
        alert("Error saving to database: " + error.message);
      } else {
        personnelList.push({ id: data[0].id, firstName, lastName, email, role });
        renderPersonnel();
        renderUserSelect();
        renderInspectorDropdown();
        e.target.reset();
      }
    }

    async function addApparatus(e) {
      e.preventDefault();
      const name = document.getElementById('app-name').value;
      const { data, error } = await supabase.from('apparatus').insert([{ name }]).select();
      if (error) {
        alert("Error saving apparatus: " + error.message);
      } else {
        apparatusList.push({ id: data[0].id, name });
        renderApparatus();
        renderStaffing();
        e.target.reset();
      }
    }

    function submitChecklist(e) {
      e.preventDefault();
      alert("Inspection Checklist Submitted Successfully!");
      e.target.reset();
    }

    function logoutUser() {
      alert("Logged out successfully.");
      switchTab('home');
    }

    window.addEventListener('DOMContentLoaded', loadAppData);
  </script>
</body>
</html>
  </script>
</body>
</html>
