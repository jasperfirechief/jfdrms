name: One-time MVA test runner
on:
  push:
    paths:
      - "api/neris-test-mva-email.js"
jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 45
      - name: Execute MVA two-patient test
        run: |
          set -e
          curl --fail-with-body --show-error --silent --max-time 120 "https://jfdrms.vercel.app/api/neris-test-mva-email"
