name: JFDRMS Encrypted Database Backup

on:
  schedule:
    - cron: '51 1 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jfdrms-database-backup
  cancel-in-progress: false

jobs:
  database-backup:
    name: Export, encrypt, and copy database backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out backup scripts
        uses: actions/checkout@v4

      - name: Verify required settings exist
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          DRIVE_BRIDGE_URL_PRIMARY: ${{ secrets.DRIVE_BRIDGE_URL_PRIMARY }}
          DRIVE_BRIDGE_HMAC_SECRET_PRIMARY: ${{ secrets.DRIVE_BRIDGE_HMAC_SECRET_PRIMARY }}
          DRIVE_BRIDGE_URL_SECONDARY: ${{ secrets.DRIVE_BRIDGE_URL_SECONDARY }}
          DRIVE_BRIDGE_HMAC_SECRET_SECONDARY: ${{ secrets.DRIVE_BRIDGE_HMAC_SECRET_SECONDARY }}
        run: |
          set -euo pipefail
          required=(
            SUPABASE_DB_URL
            BACKUP_ENCRYPTION_PASSPHRASE
            DRIVE_BRIDGE_URL_PRIMARY
            DRIVE_BRIDGE_HMAC_SECRET_PRIMARY
            DRIVE_BRIDGE_URL_SECONDARY
            DRIVE_BRIDGE_HMAC_SECRET_SECONDARY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done
          if (( ${#BACKUP_ENCRYPTION_PASSPHRASE} < 32 )); then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE must be at least 32 characters."
            exit 1
          fi

      - name: Verify database connection is Jasper FD production
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse, unquote
          expected = "audgtwcctdoiptuekqvn"
          value = urlparse(os.environ["SUPABASE_DB_URL"])
          username = unquote(value.username or "")
          direct_host = f"db.{expected}.supabase.co"
          pooler_user = f"postgres.{expected}"
          direct_match = (value.hostname or "").lower() == direct_host
          pooler_match = (value.hostname or "").lower().endswith(".pooler.supabase.com") and username == pooler_user
          if value.scheme not in ("postgres", "postgresql") or not (direct_match or pooler_match):
              raise SystemExit(
                  "Refusing to back up: SUPABASE_DB_URL cannot be positively identified "
                  "as Jasper FD production. Use the production direct connection host "
                  "or production-specific pooler username."
              )
          print("Verified database connection targets Jasper FD production.")
          PY

      - name: Verify GPG is available
        run: gpg --version

      - name: Export the complete PostgreSQL database
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jfdrms-backup"
          docker run --rm \
            --env SUPABASE_DB_URL \
            --volume "$RUNNER_TEMP/jfdrms-backup:/backup" \
            postgres:17-alpine \
            sh -euc 'pg_dump --no-owner --no-acl --format=custom --file=/backup/jfdrms.dump "$SUPABASE_DB_URL"'
          docker run --rm \
            --volume "$RUNNER_TEMP/jfdrms-backup:/backup" \
            postgres:17-alpine \
            pg_restore --list /backup/jfdrms.dump > "$RUNNER_TEMP/jfdrms-backup/archive-list.txt"
          test -s "$RUNNER_TEMP/jfdrms-backup/archive-list.txt"
          rm "$RUNNER_TEMP/jfdrms-backup/archive-list.txt"

      - name: Encrypt backup before it leaves the runner
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            --output "$RUNNER_TEMP/jfdrms-backup/jfdrms.dump.gpg" \
            "$RUNNER_TEMP/jfdrms-backup/jfdrms.dump"
          test -s "$RUNNER_TEMP/jfdrms-backup/jfdrms.dump.gpg"
          size=$(stat -c%s "$RUNNER_TEMP/jfdrms-backup/jfdrms.dump.gpg")
          if (( size > 32 * 1024 * 1024 )); then
            echo "::error::Encrypted database backup exceeds the 32 MiB Drive bridge limit."
            exit 1
          fi
          rm "$RUNNER_TEMP/jfdrms-backup/jfdrms.dump"

      - name: Copy encrypted backup to primary Drive account
        env:
          DRIVE_BRIDGE_URL_PRIMARY: ${{ secrets.DRIVE_BRIDGE_URL_PRIMARY }}
          DRIVE_BRIDGE_HMAC_SECRET_PRIMARY: ${{ secrets.DRIVE_BRIDGE_HMAC_SECRET_PRIMARY }}
        run: |
          python3 scripts/backup/upload_to_drive.py \
            --file "$RUNNER_TEMP/jfdrms-backup/jfdrms.dump.gpg" \
            --url "$DRIVE_BRIDGE_URL_PRIMARY" \
            --secret-env DRIVE_BRIDGE_HMAC_SECRET_PRIMARY

      - name: Copy encrypted backup to secondary Drive account
        env:
          DRIVE_BRIDGE_URL_SECONDARY: ${{ secrets.DRIVE_BRIDGE_URL_SECONDARY }}
          DRIVE_BRIDGE_HMAC_SECRET_SECONDARY: ${{ secrets.DRIVE_BRIDGE_HMAC_SECRET_SECONDARY }}
        run: |
          python3 scripts/backup/upload_to_drive.py \
            --file "$RUNNER_TEMP/jfdrms-backup/jfdrms.dump.gpg" \
            --url "$DRIVE_BRIDGE_URL_SECONDARY" \
            --secret-env DRIVE_BRIDGE_HMAC_SECRET_SECONDARY

      - name: Remove temporary backup files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/jfdrms-backup"
