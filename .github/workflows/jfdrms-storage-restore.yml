name: Jasper FD Production Storage Restore

on:
  workflow_dispatch:
    inputs:
      backup_date:
        description: "Backup date to restore (YYYY-MM-DD)"
        required: true
        type: string
      bucket:
        description: "Optional bucket name; leave blank to restore all buckets"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jasper-fd-production-storage-restore
  cancel-in-progress: false

jobs:
  restore:
    name: Restore missing Storage objects from Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify production settings and restore date
        shell: bash
        env:
          JASPER_FD_SUPABASE_URL: ${{ secrets.JASPER_FD_SUPABASE_URL }}
          JASPER_FD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JASPER_FD_SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
          RESTORE_BACKUP_DATE: ${{ inputs.backup_date }}
        run: |
          set -euo pipefail
          for name in JASPER_FD_SUPABASE_URL JASPER_FD_SUPABASE_SERVICE_ROLE_KEY GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_REFRESH_TOKEN GOOGLE_DRIVE_BACKUP_FOLDER_ID RESTORE_BACKUP_DATE; do
            test -n "${!name:-}" || { echo "::error::Missing required setting: ${name}"; exit 1; }
          done
          python - <<'PY'
          import os, re
          from urllib.parse import urlparse
          p = urlparse(os.environ["JASPER_FD_SUPABASE_URL"])
          if p.scheme != "https" or p.hostname != "audgtwcctdoiptuekqvn.supabase.co":
              raise SystemExit("Refusing: not the verified Jasper FD production project.")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", os.environ["RESTORE_BACKUP_DATE"]):
              raise SystemExit("Backup date must be YYYY-MM-DD.")
          print("Verified production project and restore date.")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 google-auth==2.41.1
      - name: Restore and verify missing production Storage objects
        env:
          JASPER_FD_SUPABASE_URL: ${{ secrets.JASPER_FD_SUPABASE_URL }}
          JASPER_FD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JASPER_FD_SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
          RESTORE_BACKUP_DATE: ${{ inputs.backup_date }}
          RESTORE_BUCKET: ${{ inputs.bucket }}
        run: python scripts/backup/restore_storage_from_drive.py
