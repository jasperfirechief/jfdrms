name: JFDRMS Restore Backup to Neon Mirror

on:
  workflow_dispatch:
    inputs:
      backup_filename:
        description: Exact encrypted backup filename in the selected Drive folder
        required: true
        type: string
      drive_account:
        description: Which independently stored copy to restore
        required: true
        type: choice
        options:
          - primary
          - secondary

permissions:
  contents: read

concurrency:
  group: jfdrms-neon-restore-test
  cancel-in-progress: false

jobs:
  neon-restore:
    name: Restore into dedicated JFD RMS Neon mirror only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out backup scripts
        uses: actions/checkout@v4

      - name: Validate restore target and required settings
        shell: bash
        env:
          NEON_RESTORE_DB_URL: ${{ secrets.NEON_RESTORE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BACKUP_FILENAME: ${{ inputs.backup_filename }}
        run: |
          set -euo pipefail
          test -n "$NEON_RESTORE_DB_URL" || { echo "::error::Missing NEON_RESTORE_DB_URL"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || { echo "::error::Missing BACKUP_ENCRYPTION_PASSPHRASE"; exit 1; }
          if (( ${#BACKUP_ENCRYPTION_PASSPHRASE} < 32 )); then
            echo "::error::Encryption passphrase is too short."; exit 1
          fi
          python3 - "$NEON_RESTORE_DB_URL" "$BACKUP_FILENAME" <<'PY'
          import sys
          from urllib.parse import urlparse, unquote
          import re
          raw, filename = sys.argv[1], sys.argv[2]
          parsed = urlparse(raw)
          username = unquote(parsed.username or "")
          host = (parsed.hostname or "").lower()
          expected_host = "ep-still-cherry-bdt94wqc.c-8.us-east-2.aws.neon.tech"
          if host != expected_host or "audgtwcctdoiptuekqvn" in raw:
              raise SystemExit("Refusing restore: target URL is not the approved JFD RMS Neon mirror endpoint.")
          print("Restore target guard passed: dedicated Neon mirror only.")
          PY

      - name: Select Drive bridge credentials
        id: bridge
        shell: bash
        env:
          DRIVE_BRIDGE_URL_PRIMARY: ${{ secrets.DRIVE_BRIDGE_URL_PRIMARY }}
          DRIVE_BRIDGE_HMAC_SECRET_PRIMARY: ${{ secrets.DRIVE_BRIDGE_HMAC_SECRET_PRIMARY }}
          DRIVE_BRIDGE_URL_SECONDARY: ${{ secrets.DRIVE_BRIDGE_URL_SECONDARY }}
          DRIVE_BRIDGE_HMAC_SECRET_SECONDARY: ${{ secrets.DRIVE_BRIDGE_HMAC_SECRET_SECONDARY }}
          DRIVE_ACCOUNT: ${{ inputs.drive_account }}
        run: |
          set -euo pipefail
          if [[ "$DRIVE_ACCOUNT" == "primary" ]]; then
            test -n "$DRIVE_BRIDGE_URL_PRIMARY" && test -n "$DRIVE_BRIDGE_HMAC_SECRET_PRIMARY"
            echo "url=$DRIVE_BRIDGE_URL_PRIMARY" >> "$GITHUB_OUTPUT"
            echo "secret_name=DRIVE_BRIDGE_HMAC_SECRET_PRIMARY" >> "$GITHUB_OUTPUT"
          elif [[ "$DRIVE_ACCOUNT" == "secondary" ]]; then
            test -n "$DRIVE_BRIDGE_URL_SECONDARY" && test -n "$DRIVE_BRIDGE_HMAC_SECRET_SECONDARY"
            echo "url=$DRIVE_BRIDGE_URL_SECONDARY" >> "$GITHUB_OUTPUT"
            echo "secret_name=DRIVE_BRIDGE_HMAC_SECRET_SECONDARY" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Invalid Drive account."; exit 1
          fi

      - name: Download exact encrypted backup from selected Drive
        env:
          BRIDGE_URL: ${{ steps.bridge.outputs.url }}
          BACKUP_FILENAME: ${{ inputs.backup_filename }}
          DRIVE_BRIDGE_HMAC_SECRET_PRIMARY: ${{ secrets.DRIVE_BRIDGE_HMAC_SECRET_PRIMARY }}
          DRIVE_BRIDGE_HMAC_SECRET_SECONDARY: ${{ secrets.DRIVE_BRIDGE_HMAC_SECRET_SECONDARY }}
          DRIVE_ACCOUNT: ${{ inputs.drive_account }}
        run: |
          set -euo pipefail
          if [[ "$DRIVE_ACCOUNT" == "primary" ]]; then SECRET_NAME=DRIVE_BRIDGE_HMAC_SECRET_PRIMARY
          else SECRET_NAME=DRIVE_BRIDGE_HMAC_SECRET_SECONDARY; fi
          python3 scripts/backup/download_from_drive.py \
            --url "$BRIDGE_URL" --secret-env "$SECRET_NAME" \
            --filename "$BACKUP_FILENAME" --output "$RUNNER_TEMP/jfdrms.dump.gpg"

      - name: Decrypt and validate PostgreSQL archive
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jfdrms-restore"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --output "$RUNNER_TEMP/jfdrms-restore/jfdrms.dump" \
            --decrypt "$RUNNER_TEMP/jfdrms.dump.gpg"
          docker run --rm --volume "$RUNNER_TEMP/jfdrms-restore:/restore" postgres:17-alpine \
            pg_restore --list /restore/jfdrms.dump > "$RUNNER_TEMP/jfdrms-restore/archive-list.txt"
          test -s "$RUNNER_TEMP/jfdrms-restore/archive-list.txt"
          # Supabase owns platform event triggers and auth.users. Derive the complete
          # list of application foreign keys that point to auth.users from the archive SQL,
          # then omit those TOC entries instead of maintaining a fragile hard-coded list.
          docker run --rm --volume "$RUNNER_TEMP/jfdrms-restore:/restore" postgres:17-alpine \
            pg_restore --schema=public --section=post-data --file=/restore/post-data.sql /restore/jfdrms.dump
          python3 - "$RUNNER_TEMP/jfdrms-restore/archive-list.txt" \
            "$RUNNER_TEMP/jfdrms-restore/post-data.sql" \
            "$RUNNER_TEMP/jfdrms-restore/restore-list.txt" <<'PY'
          import re
          import sys
          archive_path, sql_path, output_path = sys.argv[1:]
          with open(sql_path, encoding="utf-8") as f:
              sql = f.read()
          excluded = {
              match.group(1).strip('"')
              for match in re.finditer(
                  r'ADD CONSTRAINT\\s+("[^"]+"|[^\\s]+)\\s+[^;]*?\\bREFERENCES\\s+auth\\.users\\b',
                  sql,
                  re.IGNORECASE | re.DOTALL,
              )
          }
          if not excluded:
              raise SystemExit("Could not identify auth.users foreign keys in the backup; refusing an unfiltered restore.")
          kept = 0
          skipped = 0
          with open(archive_path, encoding="utf-8") as source, open(output_path, "w", encoding="utf-8") as target:
              for line in source:
                  if " EVENT TRIGGER " in line:
                      skipped += 1
                      continue
                  if " FK CONSTRAINT " in line and any(
                      re.search(r"\\b" + re.escape(name) + r"\\b", line) for name in excluded
                  ):
                      skipped += 1
                      continue
                  target.write(line)
                  kept += 1
          if kept == 0:
              raise SystemExit("Filtered PostgreSQL restore list is empty.")
          print(f"Archive validated; excluded {len(excluded)} auth.users foreign keys and Supabase event triggers.")
          PY
          test -s "$RUNNER_TEMP/jfdrms-restore/restore-list.txt"

      - name: Re-check target guard immediately before restore
        env:
          NEON_RESTORE_DB_URL: ${{ secrets.NEON_RESTORE_DB_URL }}
        run: |
          set -euo pipefail
          python3 - "$NEON_RESTORE_DB_URL" <<'PY'
          import sys
          from urllib.parse import urlparse, unquote
          u = urlparse(sys.argv[1])
          user = unquote(u.username or "")
          host = (u.hostname or "").lower()
          expected_host = "ep-still-cherry-bdt94wqc.c-8.us-east-2.aws.neon.tech"
          if host != expected_host:
              raise SystemExit("Restore blocked: destination is not the approved JFD RMS Neon mirror endpoint.")
          if "audgtwcctdoiptuekqvn" in sys.argv[1]:
              raise SystemExit("Restore blocked: live production project reference detected.")
          PY

      - name: Restore into Neon backup mirror
        env:
          NEON_RESTORE_DB_URL: ${{ secrets.NEON_RESTORE_DB_URL }}
        run: |
          set -euo pipefail
          # Neon is a database mirror, not a Supabase platform. Provide the minimum
          # auth.uid() and role names required to recreate RLS policies and helper functions.
          # These stubs do not authenticate users and this mirror is not app-connected.
          docker run --rm -i --env NEON_RESTORE_DB_URL postgres:17-alpine \
            psql "$NEON_RESTORE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS private;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$
              SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
            $$;
          SQL
          # Restore only the JFDRMS application schema. Supabase-managed schemas
          # such as auth, storage, and realtime must remain under platform ownership.
          # Remove dependencies left by earlier/partial test restores before pg_restore
          # drops and recreates the application's tables.
          # -i is required so the SQL heredoc reaches psql inside the container.
          docker run --rm -i --env NEON_RESTORE_DB_URL postgres:17-alpine \
            psql "$NEON_RESTORE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            obj record;
          BEGIN
            -- Foreign keys can prevent pg_restore from dropping referenced tables
            -- during its pre-data cleanup pass.
            FOR obj IN
              SELECT n.nspname, t.relname, c.conname
              FROM pg_constraint c
              JOIN pg_class t ON t.oid = c.conrelid
              JOIN pg_namespace n ON n.oid = t.relnamespace
              WHERE n.nspname = 'public' AND c.contype = 'f'
            LOOP
              EXECUTE format('ALTER TABLE %I.%I DROP CONSTRAINT IF EXISTS %I',
                             obj.nspname, obj.relname, obj.conname);
            END LOOP;

            -- Views can also block table removal. They are recreated from the backup.
            FOR obj IN
              SELECT v.schemaname, v.viewname
              FROM pg_views v
              JOIN pg_class c ON c.relname = v.viewname
              JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = v.schemaname
              WHERE v.schemaname = 'public'
                -- Never drop extension-owned objects such as PostGIS geography_columns.
                AND NOT EXISTS (
                  SELECT 1 FROM pg_depend d
                  WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid
                    AND d.refclassid = 'pg_extension'::regclass AND d.deptype = 'e'
                )
            LOOP
              EXECUTE format('DROP VIEW IF EXISTS %I.%I CASCADE',
                             obj.schemaname, obj.viewname);
            END LOOP;

            FOR obj IN
              SELECT m.schemaname, m.matviewname
              FROM pg_matviews m
              JOIN pg_class c ON c.relname = m.matviewname
              JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = m.schemaname
              WHERE m.schemaname = 'public'
                -- Preserve materialized views installed as extension members too.
                AND NOT EXISTS (
                  SELECT 1 FROM pg_depend d
                  WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid
                    AND d.refclassid = 'pg_extension'::regclass AND d.deptype = 'e'
                )
            LOOP
              EXECUTE format('DROP MATERIALIZED VIEW IF EXISTS %I.%I CASCADE',
                             obj.schemaname, obj.matviewname);
            END LOOP;
          END
          $$;
          SQL
          # Keep staged order: tables first, then data, then policies/indexes/constraints.
          docker run --rm \
            --env NEON_RESTORE_DB_URL \
            --volume "$RUNNER_TEMP/jfdrms-restore:/restore:ro" \
            postgres:17-alpine \
            pg_restore --exit-on-error --verbose --clean --if-exists --no-owner --no-acl \
              --schema=public --schema=private --section=pre-data --use-list=/restore/restore-list.txt \
              --dbname="$NEON_RESTORE_DB_URL" /restore/jfdrms.dump
          docker run --rm \
            --env NEON_RESTORE_DB_URL \
            --volume "$RUNNER_TEMP/jfdrms-restore:/restore:ro" \
            postgres:17-alpine \
            pg_restore --exit-on-error --verbose --no-owner --no-acl \
              --schema=public --schema=private --section=data --use-list=/restore/restore-list.txt \
              --dbname="$NEON_RESTORE_DB_URL" /restore/jfdrms.dump
          docker run --rm \
            --env NEON_RESTORE_DB_URL \
            --volume "$RUNNER_TEMP/jfdrms-restore:/restore:ro" \
            postgres:17-alpine \
            pg_restore --exit-on-error --verbose --clean --if-exists --no-owner --no-acl \
              --schema=public --schema=private --section=post-data --use-list=/restore/restore-list.txt \
              --dbname="$NEON_RESTORE_DB_URL" /restore/jfdrms.dump

      - name: Verify restored database contains JFDRMS tables
        env:
          NEON_RESTORE_DB_URL: ${{ secrets.NEON_RESTORE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm --env NEON_RESTORE_DB_URL postgres:17-alpine \
            psql "$NEON_RESTORE_DB_URL" -v ON_ERROR_STOP=1 -Atc \
              "SELECT count(*) > 0 FROM information_schema.tables WHERE table_schema IN ('public', 'private') AND table_type = 'BASE TABLE';" \
            | grep -qx t
          docker run --rm --env NEON_RESTORE_DB_URL postgres:17-alpine \
            psql "$NEON_RESTORE_DB_URL" -v ON_ERROR_STOP=1 -Atc \
              "SELECT 'application_tables=' || count(*) FROM information_schema.tables WHERE table_schema IN ('public', 'private') AND table_type = 'BASE TABLE';"

      - name: Remove temporary restore files
        if: always()
        run: rm -rf "$RUNNER_TEMP/jfdrms.dump.gpg" "$RUNNER_TEMP/jfdrms-restore"
