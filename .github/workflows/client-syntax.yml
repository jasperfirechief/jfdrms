name: Client syntax check
on:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and check inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          if (!scripts[1]) throw new Error('Main inline script not found');
          fs.writeFileSync('/tmp/jfd-main.js', scripts[1]);
          NODE
          node --check /tmp/jfd-main.js
