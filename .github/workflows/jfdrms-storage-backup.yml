name: JFDRMS Supabase Storage Backup

on:
  schedule:
    - cron: '30 2 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jfdrms-storage-backup
  cancel-in-progress: false

jobs:
  storage-backup:
    name: Copy Supabase Storage objects to third Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out backup scripts
        uses: actions/checkout@v4

      - name: Verify required secrets exist
        shell: bash
        env:
          SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: \${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: \${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON GOOGLE_DRIVE_BACKUP_FOLDER_ID; do
            if [[ -z "\${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: \${name}"
              exit 1
            fi
          done
          python - <<'PY'
          import json, os
          value = json.loads(os.environ["GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON"])
          assert value.get("type") == "service_account"
          assert value.get("client_email") and value.get("private_key")
          print("Google Drive service-account JSON is structurally valid.")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned backup dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests==2.32.5 \
            google-auth==2.41.1

      - name: Back up all Storage objects
        env:
          SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: \${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: \${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
        run: python scripts/backup/backup_storage_to_drive.py

