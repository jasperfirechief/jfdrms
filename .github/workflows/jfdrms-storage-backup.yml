name: Jasper FD Production Storage Backup

on:
  schedule:
    - cron: '21 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jasper-fd-production-storage-backup
  cancel-in-progress: false

jobs:
  storage-backup:
    name: Back up all Jasper FD production Storage objects
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out backup scripts
        uses: actions/checkout@v4

      - name: Verify required production and Drive settings
        shell: bash
        env:
          JASPER_FD_SUPABASE_URL: ${{ secrets.JASPER_FD_SUPABASE_URL }}
          JASPER_FD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JASPER_FD_SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
        run: |
          set -euo pipefail
          for name in JASPER_FD_SUPABASE_URL JASPER_FD_SUPABASE_SERVICE_ROLE_KEY GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_REFRESH_TOKEN GOOGLE_DRIVE_BACKUP_FOLDER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done
          python - <<'PY'
          import json, os
          from urllib.parse import urlparse
          expected = "audgtwcctdoiptuekqvn.supabase.co"
          parsed = urlparse(os.environ["JASPER_FD_SUPABASE_URL"])
          if parsed.scheme != "https" or parsed.hostname != expected:
              raise SystemExit("Refusing to run: configured Supabase URL is not Jasper FD production.")
          for name in ("GOOGLE_DRIVE_CLIENT_ID", "GOOGLE_DRIVE_CLIENT_SECRET", "GOOGLE_DRIVE_REFRESH_TOKEN"):
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"Missing Google Drive OAuth setting: {name}")
          print("Verified Jasper FD production project URL and Google Drive OAuth settings.")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned backup dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests==2.32.5 \
            google-auth==2.41.1

      - name: Back up all production Storage buckets
        env:
          JASPER_FD_SUPABASE_URL: ${{ secrets.JASPER_FD_SUPABASE_URL }}
          JASPER_FD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JASPER_FD_SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
        run: python scripts/backup/backup_storage_to_drive.py
